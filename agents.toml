# Skills and role agents for every agent session in this repo.
# Install with `bun run skills:install`. Pin every remote entry to a full commit SHA,
# because agents.lock is not committed.
version = 1
agents = ["claude", "codex"]

[trust]
github_repos = [
  "anthropics/claude-plugins-official",
  "jakubkrehel/make-interfaces-feel-better",
  "mattpocock/skills",
  "pbakaus/impeccable",
  "soundOfff/skills",
]

